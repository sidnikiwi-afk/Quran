<!DOCTYPE html>
<html lang="ar" dir="rtl" translate="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#ffffff">
    <meta name="google" content="notranslate">
    <title>Quran</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Page viewer -->
    <div id="reader">
        <div id="page-container">
            <img id="page-img" src="" alt="Quran page" draggable="false">
            <img id="page-img-2" src="" alt="Quran page" draggable="false" hidden>
        </div>
        <div id="tap-left" class="tap-zone"></div>
        <div id="tap-right" class="tap-zone"></div>
        <div id="page-indicator"></div>
        <div id="markers-layer"></div>
    </div>

    <button id="menu-btn" aria-label="Menu">&#9776;</button>

    <div id="menu-overlay" hidden>
        <div id="menu-panel"></div>
    </div>

    <div id="marker-dialog" hidden>
        <div id="marker-dialog-inner">
            <textarea id="marker-note" placeholder="Add a note (optional)"></textarea>
            <div id="marker-actions">
                <button id="marker-save">Save</button>
                <button id="marker-delete">Delete</button>
                <button id="marker-cancel">Cancel</button>
            </div>
        </div>
    </div>

    <!-- Audio player (Tier 1: continuous per-surah recitation) -->
    <div id="audio-bar" hidden>
        <div id="audio-row">
            <button id="audio-prev" aria-label="Previous surah">&#9198;</button>
            <button id="audio-playpause" aria-label="Play">&#9654;</button>
            <button id="audio-next" aria-label="Next surah">&#9197;</button>
            <div id="audio-info">
                <div id="audio-title">Recitation</div>
                <div id="audio-reciter">Bandar Baleelah</div>
            </div>
            <button id="audio-close" aria-label="Close player">&#10005;</button>
        </div>
        <div id="audio-seek-row">
            <span id="audio-cur">0:00</span>
            <input type="range" id="audio-seek" min="0" max="100" value="0" step="0.1" aria-label="Seek">
            <span id="audio-dur">0:00</span>
        </div>
    </div>
    <audio id="audio-el" preload="none" crossorigin="anonymous"></audio>

    <script src="js/app.js"></script>
</body>
</html>
